# CircleCI configuration for Android SDK
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

orbs:
  android: circleci/android@2.5.0
  slack: circleci/slack@6.1.3
  attentive: attentive-mobile/circleci-orb@0.0.11
  github-cli: circleci/github-cli@3.0.0

# ========================
# Constants
# ========================
slack_channel_ci_alerts: &slack_channel_ci_alerts "eng-mobile-sdk-ci-alerts-android"
default_context: &default_context org-global

parameters:
  run_release:
    type: boolean
    default: false
  release_version:
    type: string
    default: ""
  release_dry_run:
    type: boolean
    default: false

# Reusable environment variables
environment: &default_environment
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx4g"
  JAVA_OPTS: "-Xmx4g"
  JVM_OPTS: "-Xmx4g"

# Reusable executor
executors:
  android-executor:
    docker:
      - image: cimg/android:2026.02.1
    resource_class: large
    environment:
      <<: *default_environment

# ========================
# Commands (Reusable)
# ========================
commands:
  notify-slack-on-failure:
    description: "Send Slack notification on job failure"
    steps:
      - run:
          name: Build Slack failure payload
          when: on_fail
          command: .circleci/slack-notify-failure.sh
      - slack/notify:
          channel: *slack_channel_ci_alerts
          event: fail
          custom: |
            ${SLACK_FAILURE_PAYLOAD}

jobs:
  lint:
    executor: android-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
            - gradle-v2-
      - run:
          name: Run Android Lint
          command: ./gradlew lintDebug
      - run:
          name: Run ktlint
          command: ./gradlew ktlintCheck
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
      - store_artifacts:
          path: attentive-android-sdk/build/reports/lint-results-debug.html
          destination: lint-report.html
      - notify-slack-on-failure

  unit-test:
    executor: android-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
            - gradle-v2-
      - run:
          name: Run Unit Tests with Coverage
          command: ./gradlew testDebugUnitTest jacocoTestReport
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
      # Store JUnit test results for CircleCI test insights
      - store_test_results:
          path: attentive-android-sdk/build/test-results/testDebugUnitTest
      # Store test report as artifact
      - store_artifacts:
          path: attentive-android-sdk/build/reports/tests/testDebugUnitTest
          destination: unit-test-report
      # Store JaCoCo coverage report
      - store_artifacts:
          path: attentive-android-sdk/build/reports/jacoco/jacocoTestReport
          destination: coverage-report
      # Store coverage XML for potential CI integration (Codecov, etc.)
      - persist_to_workspace:
          root: attentive-android-sdk/build/reports
          paths:
            - jacoco/jacocoTestReport/jacocoTestReport.xml
      - notify-slack-on-failure

  instrumented-test:
    machine:
      image: android:default
    resource_class: large
    environment:
      <<: *default_environment
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
            - gradle-v2-
      - android/create-avd:
          avd-name: test-avd
          system-image: system-images;android-30;google_apis;x86_64
          install: true
      - android/start-emulator:
          avd-name: test-avd
          no-window: true
          restore-gradle-cache-prefix: gradle-v2
          post-emulator-launch-assemble-command: ./gradlew :attentive-android-sdk:assembleDebugAndroidTest
      - run:
          # Keyboard tests need the test activity to hold window focus
          name: Unlock emulator and close system dialogs
          command: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" || true
      - run:
          name: Run Instrumented Tests
          command: ./gradlew :attentive-android-sdk:connectedDebugAndroidTest
          no_output_timeout: 20m
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
      # Store instrumented test results
      - store_test_results:
          path: attentive-android-sdk/build/outputs/androidTest-results/connected
      # Store instrumented test report
      - store_artifacts:
          path: attentive-android-sdk/build/reports/androidTests/connected
          destination: instrumented-test-report
      # Store instrumented test coverage
      - store_artifacts:
          path: attentive-android-sdk/build/reports/coverage/androidTest/debug
          destination: instrumented-coverage-report
      - notify-slack-on-failure

  build:
    executor: android-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
            - gradle-v2-
      - run:
          name: Build SDK
          command: ./gradlew :attentive-android-sdk:assembleRelease
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
      - store_artifacts:
          path: attentive-android-sdk/build/outputs/aar
          destination: aar
      - notify-slack-on-failure

  snapshot-test:
    executor: android-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-snapshot-v1-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "bonni/build.gradle" }}
            - gradle-snapshot-v1-
      - run:
          name: Verify Snapshot Tests
          command: ./gradlew :bonni:verifyRoborazziDebug
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-snapshot-v1-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "bonni/build.gradle" }}
      - store_artifacts:
          path: bonni/build/outputs/roborazzi
          destination: snapshot-diffs
      - notify-slack-on-failure

  distribute-bonni:
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Check if versionCode changed
          command: |
            # Get current versionCode
            CURRENT_VERSION=$(grep -E "versionCode\s*=" bonni/build.gradle | grep -oE "[0-9]+")

            # Fetch the base branch to compare against
            git fetch origin "$CIRCLE_BRANCH"

            # Get versionCode from the previous commit on this branch (before the push)
            PREVIOUS_VERSION=$(git show origin/$CIRCLE_BRANCH^:bonni/build.gradle 2>/dev/null | grep -E "versionCode\s*=" | grep -oE "[0-9]+" || echo "")

            echo "Current versionCode: $CURRENT_VERSION"
            echo "Previous versionCode: $PREVIOUS_VERSION"

            if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
              echo "versionCode unchanged, skipping distribution"
              circleci-agent step halt
            else
              echo "versionCode changed ($PREVIOUS_VERSION -> $CURRENT_VERSION), proceeding with distribution"
            fi
      - restore_cache:
          keys:
            - gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
            - gradle-v2-
      - run:
          name: Decode Keystore
          command: echo "$BONNI_KEYSTORE_BASE64" | base64 -d > bonni/bonni-release.keystore
      - run:
          name: Build Bonni Release APK
          command: ./gradlew :bonni:assembleRelease
      - restore_cache:
          keys:
            - firebase-cli-v1
      - run:
          name: Install Firebase CLI
          command: |
            if ! command -v firebase &> /dev/null; then
              npm install -g firebase-tools
            fi
      - save_cache:
          paths:
            - ~/.npm
            - /usr/local/lib/node_modules/firebase-tools
          key: firebase-cli-v1
      - run:
          name: Validate APK
          command: |
            APK_PATH="bonni/build/outputs/apk/release/bonni-release.apk"
            if [ ! -f "$APK_PATH" ]; then
              echo "Error: APK not found at $APK_PATH"
              exit 1
            fi
            if [ ! -s "$APK_PATH" ]; then
              echo "Error: APK file is empty"
              exit 1
            fi
            echo "APK validated: $(ls -lh $APK_PATH)"
      - run:
          name: Upload to Firebase App Distribution
          command: |
            firebase appdistribution:distribute bonni/build/outputs/apk/release/bonni-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups "dev, product-+-eng"
      - run:
          name: Cleanup keystore
          when: always
          command: rm -f bonni/bonni-release.keystore
      - store_artifacts:
          path: bonni/build/outputs/apk/release
          destination: bonni-apk
      - notify-slack-on-failure

  release:
    executor: android-executor
    steps:
      - checkout
      - attentive/app-based-github-token:
          github_app_client_id: ${GITHUB_APP_CLIENT_ID}
          github_app_private_key_base64: ${GITHUB_APP_PRIVATE_KEY_BASE64}
          github_app_installation_id: ${GITHUB_APP_INSTALLATION_ID}
      # cimg/android does not bundle the gh CLI, and `gh pr create` / `gh release create`
      # below need it. `install` is enough; `setup` would run a redundant gh auth login.
      - github-cli/install:
          version: "2.97.0"
      # Do NOT let gh fall back to GITHUB_TOKEN. The org-global context defines it as a
      # classic PAT for the machine user circleci-attentive, which is read-only here
      # (pull: true, push: false), so gh pr create fails with "must be a collaborator"
      # and gh release create fails with a misleading "workflow scope may be required".
      # That is what broke the 2.2.2 release (MSDK-485).
      #
      # The step above mints an App installation token. Find it by prefix: ghs_ is an App
      # installation token, ghp_/gho_/ghu_/github_pat_ are user tokens. Hand it to gh as
      # GH_TOKEN, which gh prefers over GITHUB_TOKEN. Write access is verified later by
      # creating the draft GitHub Release.
      - run:
          name: Select the App token for gh
          command: |
            echo "GitHub tokens visible in the environment (name and type prefix only):"
            APP_TOKEN_VAR=""
            for name in $(compgen -v); do
              val="${!name-}"
              case "$val" in
                ghs_*)
                  echo "  $name = ghs_… (App installation token)"
                  [ -n "$APP_TOKEN_VAR" ] || APP_TOKEN_VAR="$name"
                  ;;
                ghp_*|gho_*|ghu_*|github_pat_*)
                  echo "  $name = ${val%%_*}_… (user token — not usable for the release)"
                  ;;
              esac
            done

            if [ -z "$APP_TOKEN_VAR" ]; then
              echo "ERROR: no App installation token (ghs_…) found in the environment."
              echo "The 'Generate ephemeral app-based github token' step should provide one."
              exit 1
            fi

            echo "Using \$$APP_TOKEN_VAR as GH_TOKEN"
            export GH_TOKEN="${!APP_TOKEN_VAR}"
            echo "export GH_TOKEN=\"\$$APP_TOKEN_VAR\"" >> "$BASH_ENV"
      - run:
          name: Switch git remote to HTTPS with App token
          command: |
            git remote set-url origin "https://github.com/attentive-mobile/attentive-android-sdk.git"
            git config --local --replace-all \
              "http.https://github.com/.extraheader" \
              "Authorization: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
      - restore_cache:
          keys:
            - gradle-v2-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "attentive-android-sdk/build.gradle" }}
            - gradle-v2-
      - run:
          name: Determine release version
          command: |
            if [ -n "<< pipeline.parameters.release_version >>" ]; then
              VERSION="<< pipeline.parameters.release_version >>"
            else
              VERSION=$(grep '^VERSION_NAME=' attentive-android-sdk/gradle.properties | cut -d'=' -f2)
            fi
            echo "export RELEASE_VERSION=$VERSION" >> "$BASH_ENV"

            if echo "$VERSION" | grep -qi "beta"; then
              echo "export IS_BETA=true" >> "$BASH_ENV"
              echo "Beta release detected — skipping GitHub Release"
            else
              echo "export IS_BETA=false" >> "$BASH_ENV"
            fi

            echo "Releasing: $VERSION"
      # Creating the draft is the write-access check: it needs the same contents write as
      # publishing the release, and it happens before anything irreversible. The repo
      # API's .permissions object can't be used for this — it reports false for every
      # permission on an App installation token (MSDK-532).
      - run:
          name: Create draft GitHub Release
          command: |
            if [ "$IS_BETA" = "true" ]; then
              echo "Beta release; no GitHub Release to draft"
              exit 0
            fi
            REPO=attentive-mobile/attentive-android-sdk
            if EXISTING=$(gh release view "$RELEASE_VERSION" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null); then
              if [ "$EXISTING" = "true" ]; then
                echo "Reusing draft release $RELEASE_VERSION from an earlier run"
                exit 0
              fi
              echo "ERROR: release $RELEASE_VERSION is already published."
              exit 1
            fi
            gh release create "$RELEASE_VERSION" \
              --repo "$REPO" \
              --draft \
              --target "$(git rev-parse HEAD)" \
              --title "$RELEASE_VERSION" \
              --generate-notes
            # Cleanup below only deletes a draft this run created, never one kept for recovery.
            echo "export DRAFT_CREATED=true" >> "$BASH_ENV"
      - when:
          condition: << pipeline.parameters.release_dry_run >>
          steps:
            - run:
                name: Dry run - delete the draft and stop
                command: |
                  if [ "${DRAFT_CREATED:-}" = "true" ]; then
                    gh release delete "$RELEASE_VERSION" --repo attentive-mobile/attentive-android-sdk --yes
                  fi
                  echo "Dry run complete: token can write releases. Nothing was published."
      - unless:
          condition: << pipeline.parameters.release_dry_run >>
          steps:
            - run:
                name: Push release branch and open PR
                command: |
                  git config user.name "circleci[bot]"
                  git config user.email "circleci[bot]@users.noreply.github.com"

                  BRANCH="release/$RELEASE_VERSION"
                  git checkout -b "$BRANCH"
                  sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$RELEASE_VERSION/" attentive-android-sdk/gradle.properties
                  git add attentive-android-sdk/gradle.properties

                  if git diff --cached --quiet; then
                    echo "gradle.properties already at $RELEASE_VERSION; skipping release branch + PR. Publishing from current commit."
                  else
                    git commit -m "Set version to $RELEASE_VERSION"
                    git push --force origin "$BRANCH"

                    # The PR is bookkeeping; the Maven Central publish below is the release.
                    # Never abort here: the branch is already pushed, so a failure would strand
                    # the release half-done — version bumped on the branch, nothing published.
                    if PR_OUTPUT=$(gh pr create \
                      --repo attentive-mobile/attentive-android-sdk \
                      --title "Release v$RELEASE_VERSION" \
                      --body "Automated release PR. Maven Central publish and GitHub Release are performed from this branch by CircleCI. Merge into main once verified." \
                      --head "$BRANCH" \
                      --base main 2>&1); then
                      echo "$PR_OUTPUT"
                    else
                      echo "$PR_OUTPUT"
                      echo
                      echo "WARNING: could not open the release PR — continuing with the publish."
                      echo "See 'Select the App token for gh' above for which token gh is using."
                      echo "Open the PR manually:"
                      echo "  https://github.com/attentive-mobile/attentive-android-sdk/compare/main...$BRANCH?expand=1"
                    fi
                  fi
            - run:
                name: Clean
                command: ./gradlew clean
            - run:
                name: Publish to Maven Central
                command: |
                  ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
                  echo "export MAVEN_PUBLISHED=true" >> "$BASH_ENV"
            - run:
                name: Publish GitHub Release
                command: |
                  if [ "$IS_BETA" = "true" ]; then
                    echo "Skipping GitHub Release for beta version"
                    exit 0
                  fi
                  git tag "$RELEASE_VERSION"
                  git push origin "$RELEASE_VERSION"
                  gh release edit "$RELEASE_VERSION" \
                    --repo attentive-mobile/attentive-android-sdk \
                    --tag "$RELEASE_VERSION" \
                    --draft=false
      - run:
          name: Delete draft GitHub Release after a failed publish
          when: on_fail
          command: |
            # Once Maven Central has the artifact, keep the draft so it can be published by hand.
            [ "${DRAFT_CREATED:-}" = "true" ] && [ "${MAVEN_PUBLISHED:-}" != "true" ] || exit 0
            gh release delete "$RELEASE_VERSION" --repo attentive-mobile/attentive-android-sdk --yes
      - notify-slack-on-failure

workflows:
  build-and-test:
    unless: << pipeline.parameters.run_release >>
    jobs:
      - lint:
          context: *default_context
      - unit-test:
          context: *default_context
      - instrumented-test:
          context: *default_context
      - snapshot-test:
          context: *default_context
      - build:
          context: *default_context
          requires:
            - lint
            - unit-test
            - instrumented-test
            - snapshot-test
      - distribute-bonni:
          context: *default_context
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - develop

  release:
    when: << pipeline.parameters.run_release >>
    jobs:
      - release:
          context: *default_context
