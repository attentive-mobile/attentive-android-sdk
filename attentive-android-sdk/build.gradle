plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    id 'jacoco'
}

def versionName = properties["VERSION_NAME"]

android {
    namespace = 'com.attentive.androidsdk'

    android.buildFeatures.buildConfig true

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()

        // Consumers only need compileSdk 35 to build against this AAR. Left unset, AGP 9
        // derives the floor from our own compileSdk (37) and stamps minCompileSdk=37, which
        // fails checkDebugAarMetadata in every host app on a lower compileSdk. No AGP flag
        // bypasses that check, so the app cannot opt out: it must raise compileSdk to 37,
        // which in turn requires AGP >= 8.10.1 and Kotlin >= 2.1.20. For a React Native host
        // that means RN >= 0.81 (the RN template still defaults to compileSdk 36 through
        // 0.83), so a 37 floor silently drops every RN app below that.
        aarMetadata {
            minCompileSdk = 35
        }

        buildConfigField "String", "VERSION_NAME", "\"$versionName\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }


    buildTypes {
        debug {
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()

        // Stamp class metadata as 2.0.0 instead of 2.2.0. A Kotlin compiler reads its own
        // metadata version or one minor ahead, so an artifact built by 2.2.10 is unreadable
        // to the 2.0.x compilers that React Native 0.77-0.80 pin: consumers get "Module was
        // compiled with an incompatible version of Kotlin. The binary version of its metadata
        // is 2.2.0, expected version is 2.0.0" and have to add -Xskip-metadata-version-check
        // to their own app module. Our sources compile clean at language level 2.0; the cost
        // is that we cannot use 2.1/2.2 language features until consumers move up.
        languageVersion = "2.0"
        apiVersion = "2.0"
    }

    lint {
        baseline = file("lint-baseline.xml")
        lintConfig = rootProject.file("lint.xml")
        targetSdk libs.versions.targetSdk.get().toInteger()
    }

    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "2.0.0"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
        targetSdk libs.versions.targetSdk.get().toInteger()
    }

    testFixtures {
        enable = true
    }

    publishing {
        singleVariant('release')
    }
    sourceSets {
        main {
            java {
                srcDirs 'src/main/java'
            }
        }
        test {
            java {
                srcDirs 'src/test/java'
            }
        }
        androidTest {
            java {
                srcDirs 'src/androidTest/java'
            }
        }
    }
}

// Attach kotlin-stdlib 2.0.21 rather than the 2.2.10 that KGP would pull in to match the
// compiler. The stdlib is a compile-scope dependency of this module, so its own 2.2.0 metadata
// lands on consumers' compile classpath and trips the same check as above even when our own
// classes are readable.
kotlin { coreLibrariesVersion = "2.0.21" }

dependencies {
    // Lint checks bundled with the SDK
    lintPublish(project(":attentive-lint"))

    // AndroidX
    implementation(libs.androidx.appcompat)
    implementation(libs.androidx.constraintlayout)
    implementation(libs.androidx.webkit)
    implementation(libs.androidx.activity.ktx)
    implementation(libs.androidx.activity)
    implementation(libs.androidx.lifecycle.process)
    implementation(libs.androidx.lifecycle.runtime.compose)
    androidTestImplementation(libs.androidx.test.runner)

    // Google Material
    implementation(libs.google.material)

    // Logging
    implementation(libs.timber)

    // Room (offline request buffer)
    implementation(libs.bundles.room)
    ksp(libs.androidx.room.compiler)

    // WorkManager (offline request buffer flush trigger)
    implementation(libs.androidx.work.runtime.ktx)
    testImplementation(libs.androidx.work.testing)

    // Networking
    api(libs.okhttp)
    implementation(libs.okhttp.logging)
    implementation(libs.retrofit)
    implementation(libs.retrofit.gson)
    implementation(libs.retrofit.kotlinx.serialization)
    implementation(libs.gson)

    // Serialization
    implementation(libs.kotlinx.serialization.json)

    // Coroutines
    implementation(libs.bundles.coroutines)

    // Compose
    implementation(platform(libs.androidx.compose.bom))
    implementation(libs.bundles.compose.sdk)
    debugImplementation(libs.androidx.compose.ui.tooling)
    implementation(libs.androidx.compose.ui.tooling.preview)

    // Image loading
    implementation(libs.bundles.coil)

    // Firebase
    implementation(platform(libs.firebase.bom))
    implementation(libs.firebase.messaging)

    // Testing
    testImplementation(libs.junit)
    testImplementation(libs.mockito.inline)
    testImplementation(libs.mockito.kotlin)
    testImplementation(libs.kotlinx.coroutines.test)

    androidTestImplementation(libs.androidx.test.junit)
    androidTestImplementation(libs.androidx.test.espresso)
    androidTestImplementation(libs.mockito.android)
}

ext {
    PUBLISH_GROUP_ID = 'com.attentive'
    PUBLISH_VERSION = "$versionName"
    PUBLISH_ARTIFACT_ID = 'attentive-android-sdk'
}

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"

// JaCoCo configuration
jacoco {
    toolVersion = "0.8.11"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/*$ViewInjector*.*',
        '**/*$ViewBinder*.*',
        '**/Lambda$*.class',
        '**/Lambda.class',
        '**/*Lambda.class',
        '**/*Lambda*.class',
        '**/*_MembersInjector.class',
        '**/Dagger*Component*.class',
        '**/Dagger*Subcomponent*.class',
        '**/*Subcomponent$Builder.class',
        '**/*Module_*Factory.class',
    ]

    def debugTree = fileTree(
        dir: "${buildDir}/tmp/kotlin-classes/debug",
        excludes: fileFilter
    ) + fileTree(
        dir: "${buildDir}/intermediates/javac/debug/classes",
        excludes: fileFilter
    )

    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(
        dir: "$buildDir",
        includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'jacoco/testDebugUnitTest.exec'
        ]
    ))
}
